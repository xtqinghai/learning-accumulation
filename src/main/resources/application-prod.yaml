spring:
  config:
    activate:
      on-profile: prod
  datasource:
    dynamic:
      strict: false
      public-key: ${DYNAMIC_DATASOURCE_PUBLIC_KEY:}
      primary: hboot
      datasource:
        hboot:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${HBOOT_DB_URL}
          username: ${HBOOT_DB_USERNAME}
          password: ${HBOOT_DB_PASSWORD}
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: ${HBOOT_DB_INITIAL_SIZE:5}
            min-idle: ${HBOOT_DB_MIN_IDLE:5}
            max-active: ${HBOOT_DB_MAX_ACTIVE:20}
            max-wait: ${HBOOT_DB_MAX_WAIT:60000}
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1
            test-on-borrow: false
            test-on-return: false
            filters: stat,wall,slf4j
            connection-properties:
              druid.stat.mergeSql: true
              druid.stat.slowSqlMillis: 2000
        engine:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${ENGINE_DB_URL}
          username: ${ENGINE_DB_USERNAME}
          password: ${ENGINE_DB_PASSWORD}
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: ${ENGINE_DB_INITIAL_SIZE:5}
            min-idle: ${ENGINE_DB_MIN_IDLE:5}
            max-active: ${ENGINE_DB_MAX_ACTIVE:20}
            max-wait: ${ENGINE_DB_MAX_WAIT:60000}
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1
            test-on-borrow: false
            test-on-return: false
            filters: stat,wall,slf4j
            connection-properties:
              druid.stat.mergeSql: true
              druid.stat.slowSqlMillis: 2000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:10000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:5000ms}

logging:
  level:
    com.quinn.hboot: info
    com.alibaba.druid: warn
    org.springframework.web: warn

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  show-actuator: false

warm-flow:
  banner: false
  ui: false

file:
  local:
    base-path: ${FILE_LOCAL_BASE_PATH}
    public-url: ${FILE_PUBLIC_URL}

app:
  api-docs:
    enabled: false
  security:
    auth-excludes:
      - /api/auth/**
      - /api/register/**
      - /api/v1/file/preview/**
      - /public/**
      - /favicon.ico
  druid:
    monitor:
      enabled: false
      username: ${APP_DRUID_MONITOR_USERNAME:}
      password: ${APP_DRUID_MONITOR_PASSWORD:}
      allow: ${APP_DRUID_MONITOR_ALLOW:}
      deny: ${APP_DRUID_MONITOR_DENY:}
      reset-enable: false
      session-stat-enable: false
      session-stat-max-count: 1000
      profile-enable: false
      log-slow-sql: true
      merge-sql: true
      slow-sql-millis: 2000
      multi-statement-allow: false
