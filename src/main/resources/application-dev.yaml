spring:
  config:
    activate:
      on-profile: dev
  datasource:
    dynamic:
      strict: false
      public-key: ${DYNAMIC_DATASOURCE_PUBLIC_KEY:438704315@qq.com}
      primary: hboot
      datasource:
        hboot:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${HBOOT_DB_URL:jdbc:mysql://localhost:13306/h_boot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
          username: ${HBOOT_DB_USERNAME:root}
          password: ${HBOOT_DB_PASSWORD:123456}
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1 FROM DUAL
            test-on-borrow: false
            test-on-return: false
            filters: stat,wall,slf4j
            connection-properties:
              druid.stat.mergeSql: true
              druid.stat.slowSqlMillis: 2000
        engine:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${ENGINE_DB_URL:jdbc:mysql://localhost:13306/h_boot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
          username: ${ENGINE_DB_USERNAME:root}
          password: ${ENGINE_DB_PASSWORD:123456}
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1 FROM DUAL
            test-on-borrow: false
            test-on-return: false
            filters: stat,wall,slf4j
            connection-properties:
              druid.stat.mergeSql: true
              druid.stat.slowSqlMillis: 2000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:10000ms}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 5000ms

logging:
  pattern:
    level: "%5p [traceId:%X{traceId} biz:%X{businessId} inst:%X{instanceId}]"
  level:
    com.quinn.hboot: debug
    com.alibaba.druid: info
    org.springframework.web: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  show-actuator: true

warm-flow:
  banner: true
  ui: true

file:
  local:
    base-path: ${FILE_LOCAL_BASE_PATH:${user.home}/upload-dev}
    public-url: ${FILE_PUBLIC_URL:http://localhost:${server.port}/api/v1/file/preview}

app:
  api-docs:
    enabled: true
  cache:
    menu: 30m
    menu-tree: 30m
    role-menu: 30m
    dict: 1h
    dept: 30m
    user-base: 20m
    user-auth: 20m
    flow-category: 30d
    menu-max-size: 256
    menu-tree-max-size: 256
    role-menu-max-size: 512
    dict-max-size: 256
    dept-max-size: 256
    user-base-max-size: 2048
    user-auth-max-size: 2048
    flow-category-max-size: 256
  sql-audit:
    top-n: 20
  security:
    auth-excludes:
      - /api/auth/**
      - /api/register/**
      - /api/test/**
      - /api/v1/file/preview/**
      - /public/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /webjars/**
      - /favicon.ico
      - /druid/**
      - /warm-flow-ui/**
      - /warm-flow/**
  druid:
    monitor:
      enabled: true
      username: ${APP_DRUID_MONITOR_USERNAME:admin}
      password: ${APP_DRUID_MONITOR_PASSWORD:admin}
      allow: ${APP_DRUID_MONITOR_ALLOW:127.0.0.1}
      deny: ${APP_DRUID_MONITOR_DENY:}
      reset-enable: false
      session-stat-enable: true
      session-stat-max-count: 1000
      profile-enable: true
      log-slow-sql: true
      merge-sql: true
      slow-sql-millis: 2000
      multi-statement-allow: false
