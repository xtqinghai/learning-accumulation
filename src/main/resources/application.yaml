server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId} biz:%X{businessId} inst:%X{instanceId}]"
  level:
    com.quinn.hboot: info
    com.alibaba.druid: info
    org.springframework.web: info

spring:
  application:
    name: hboot-system
  config:
    import: classpath:codegen.yml
  profiles:
    default: dev
    group:
      debug:
        - dev
  servlet:
    multipart:
      enabled: true
      max-file-size: ${APP_MAX_FILE_SIZE:100MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:100MB}
  main:
    allow-circular-references: true

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.quinn.hboot.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${APP_API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${APP_API_DOCS_ENABLED:false}
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    default-model-expand-depth: 2
    default-model-rendering: example
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

file:
  storage: ${FILE_STORAGE:local}
  local:
    base-path: ${FILE_LOCAL_BASE_PATH:${user.home}/upload}
    public-url: ${FILE_PUBLIC_URL:http://localhost:${server.port}/api/v1/file/preview}
  security:
    enabled: ${FILE_SECURITY_ENABLED:true}
    max-file-size: ${FILE_SECURITY_MAX_FILE_SIZE:104857600}
    antivirus-enabled: ${FILE_SECURITY_ANTIVIRUS_ENABLED:false}
    allowed-extensions:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - csv
      - md
      - json
      - xml
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - bmp
      - svg
      - mp3
      - wav
      - aac
      - flac
      - ogg
      - mp4
      - avi
      - mov
      - mkv
      - webm
      - zip
      - rar
      - 7z
      - tar
      - gz
    allowed-mime-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - text/plain
      - text/csv
      - text/markdown
      - application/json
      - application/xml
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - image/bmp
      - image/svg+xml
      - audio/mpeg
      - audio/wav
      - audio/aac
      - audio/flac
      - audio/ogg
      - video/mp4
      - video/x-msvideo
      - video/quicktime
      - video/x-matroska
      - video/webm
      - application/zip
      - application/x-rar-compressed
      - application/x-7z-compressed
      - application/x-tar
      - application/gzip
    blocked-extensions:
      - exe
      - bat
      - cmd
      - com
      - msi
      - sh
      - ps1
      - vbs
      - js
      - jse
      - jar
      - war
      - php
      - jsp
      - aspx
      - html
      - htm

warm-flow:
  enabled: ${WARM_FLOW_ENABLED:true}
  banner: ${WARM_FLOW_BANNER:false}
  key_type: SnowId19
  ui: ${WARM_FLOW_UI_ENABLED:false}
  token-name: Authorization
  top-text-show: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    defaults:
      enabled: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: ${APP_AUTH_SESSION_TIMEOUT_SECONDS:7200}
  active-timeout: ${APP_AUTH_SESSION_ACTIVE_TIMEOUT_SECONDS:7200}
  is-concurrent: ${APP_AUTH_ALLOW_CONCURRENT_LOGIN:true}
  is-share: false
  is-log: false

app:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:false}
  auth:
    login-fail-prefix: ${APP_AUTH_LOGIN_FAIL_PREFIX:login:fail:}
    max-retry-count: ${APP_AUTH_MAX_RETRY_COUNT:5}
    retry-lock-minutes: ${APP_AUTH_RETRY_LOCK_MINUTES:10}
    session-timeout-seconds: ${APP_AUTH_SESSION_TIMEOUT_SECONDS:7200}
    session-active-timeout-seconds: ${APP_AUTH_SESSION_ACTIVE_TIMEOUT_SECONDS:7200}
    allow-concurrent-login: ${APP_AUTH_ALLOW_CONCURRENT_LOGIN:true}
    kickout-old-session: ${APP_AUTH_KICKOUT_OLD_SESSION:true}
  cache:
    menu: 30m
    menu-tree: 30m
    role-menu: 30m
    dict: 1h
    dept: 30m
    user-base: 20m
    user-auth: 20m
    flow-category: 30d
    menu-max-size: 256
    menu-tree-max-size: 256
    role-menu-max-size: 512
    dict-max-size: 256
    dept-max-size: 256
    user-base-max-size: 2048
    user-auth-max-size: 2048
    flow-category-max-size: 256
  sql-audit:
    top-n: 20
  security:
    auth-excludes:
      - /api/auth/**
      - /api/register/**
      - /api/v1/file/preview/**
      - /public/**
      - /favicon.ico
  druid:
    monitor:
      enabled: ${APP_DRUID_MONITOR_ENABLED:false}
      username: ${APP_DRUID_MONITOR_USERNAME:}
      password: ${APP_DRUID_MONITOR_PASSWORD:}
      allow: ${APP_DRUID_MONITOR_ALLOW:}
      deny: ${APP_DRUID_MONITOR_DENY:}
      reset-enable: false
      session-stat-enable: true
      session-stat-max-count: 1000
      profile-enable: false
      log-slow-sql: true
      merge-sql: true
      slow-sql-millis: 2000
      multi-statement-allow: false
