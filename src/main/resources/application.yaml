server:
  port: 8080
  multipart:
    enabled: true
    max-file-size: 100MB
    max-request-size: 100MB

logging:
  level:
    com.quinn.hboot: debug
    com.alibaba.druid: info  # 璋冩暣涓篿nfo锛岄伩鍏嶈繃澶氭棩蹇?
    org.springframework.web: debug

spring:
  application:
    name: hboot-system
  config:
    import: classpath:codegen.yml
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # ========== 鍔ㄦ€佸鏁版嵁婧愰厤缃紙绠€鍖栵級==========
  datasource:
    dynamic:
      strict: false
      public-key: "438704315@qq.com"
      primary: hboot
      datasource:
        hboot:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:13306/h_boot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: 123456
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1 FROM DUAL
            test-on-borrow: false
            test-on-return: false
            # 搴旂敤杩囨护鍣?
            filters: stat,wall,slf4j
            connection-properties:
              druid.stat.mergeSql: true
              druid.stat.slowSqlMillis: 2000

        engine:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:13306/h_boot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: 123456
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1 FROM DUAL
            test-on-borrow: false
            test-on-return: false
            # 搴旂敤杩囨护鍣?
            filters: stat,wall,slf4j
            connection-properties:
              druid.stat.mergeSql: true
              druid.stat.slowSqlMillis: 2000
  data:
    redis:
      # 鍩虹閰嶇疆
      host: localhost
      port: 6379
      password:  # 鏃犲瘑鐮佸垯绌猴紝鏈夊瘑鐮佸～鍐欎綘鐨剅edis瀵嗙爜
      database: 0
      # 瓒呮椂閰嶇疆
      timeout: 10000ms  # 杩炴帴瓒呮椂鏃堕棿锛屽崟浣峬s
      # lettuce瀹㈡埛绔厤缃紙SpringBoot3.x榛樿瀹㈡埛绔紝涓嶇敤鏀癸級
      lettuce:
        pool:
          max-active: 8    # 杩炴帴姹犳渶澶ц繛鎺ユ暟
          max-idle: 8      # 杩炴帴姹犳渶澶х┖闂茶繛鎺ユ暟
          min-idle: 2      # 杩炴帴姹犳渶灏忕┖闂茶繛鎺ユ暟
          max-wait: 5000ms # 杩炴帴姹犺幏鍙栬繛鎺ョ殑鏈€澶х瓑寰呮椂闂达紝瓒呮椂浼氭姤閿?
# 鍏佽寰幆寮曠敤 turbo浣跨敤
  main:
    allow-circular-references: true

# MyBatis-Plus 閰嶇疆淇濇寔涓嶅彉...

# MyBatis-Plus 閰嶇疆淇濇寔涓嶅彉...

# MyBatis-Plus 閰嶇疆
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.quinn.hboot.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# 鍏朵粬閰嶇疆淇濇寔涓嶅彉...


# springdoc/swagger 閰嶇疆 涓嶅彉
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    default-model-expand-depth: 2
    default-model-rendering: example
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# 鏂囦欢瀛樺偍閰嶇疆 涓嶅彉
file:
  storage: local
  local:
    base-path: c:/upload
    public-url: http://localhost:8080/api/v1/file/preview

warm-flow:
  # 鏄惁寮€鍚伐浣滄祦锛岄粯璁rue
  enabled: true
  # 鏄惁鏄剧ずbanner鍥撅紝榛樿鏄?
  banner: true
  # id鐢熸垚鍣ㄧ被鍨? 涓嶅～榛樿涓簅rm鎵╁睍鑷甫鐢熸垚鍣ㄦ垨鑰厀arm-flow鍐呯疆鐨?9浣嶉洩鑺辩畻娉? SnowId14:14浣嶏紝SnowId15:15浣嶏紝 SnowFlake19锛?9浣?
