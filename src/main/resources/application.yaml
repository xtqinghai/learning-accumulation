server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.quinn.hboot: info
    com.alibaba.druid: info
    org.springframework.web: info

spring:
  application:
    name: hboot-system
  config:
    import: classpath:codegen.yml
  profiles:
    default: dev
    group:
      debug:
        - dev
  servlet:
    multipart:
      enabled: true
      max-file-size: ${APP_MAX_FILE_SIZE:100MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:100MB}
  main:
    allow-circular-references: true

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.quinn.hboot.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${APP_API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${APP_API_DOCS_ENABLED:false}
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    default-model-expand-depth: 2
    default-model-rendering: example
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

file:
  storage: ${FILE_STORAGE:local}
  local:
    base-path: ${FILE_LOCAL_BASE_PATH:${user.home}/upload}
    public-url: ${FILE_PUBLIC_URL:http://localhost:${server.port}/api/v1/file/preview}

warm-flow:
  enabled: ${WARM_FLOW_ENABLED:true}
  banner: ${WARM_FLOW_BANNER:false}
  key_type: SnowId19
  ui: ${WARM_FLOW_UI_ENABLED:false}
  token-name: Authorization
  top-text-show: true

app:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:false}
  auth:
    login-fail-prefix: ${APP_AUTH_LOGIN_FAIL_PREFIX:login:fail:}
    max-retry-count: ${APP_AUTH_MAX_RETRY_COUNT:5}
    retry-lock-minutes: ${APP_AUTH_RETRY_LOCK_MINUTES:10}
  security:
    auth-excludes:
      - /api/auth/**
      - /api/register/**
      - /api/v1/file/preview/**
      - /public/**
      - /favicon.ico
  druid:
    monitor:
      enabled: ${APP_DRUID_MONITOR_ENABLED:false}
      username: ${APP_DRUID_MONITOR_USERNAME:}
      password: ${APP_DRUID_MONITOR_PASSWORD:}
      allow: ${APP_DRUID_MONITOR_ALLOW:}
      deny: ${APP_DRUID_MONITOR_DENY:}
      reset-enable: false
      session-stat-enable: true
      session-stat-max-count: 1000
      profile-enable: false
      log-slow-sql: true
      merge-sql: true
      slow-sql-millis: 2000
      multi-statement-allow: false
