server:
  port: 8080
  multipart:
    enabled: true
    max-file-size: 100MB
    max-request-size: 100MB

logging:
  level:
    com.quinn.hboot: debug
    com.alibaba.druid: info  # 调整为info，避免过多日志
    org.springframework.web: debug

spring:
  application:
    name: hboot-system
  config:
    import: classpath:codegen.yml
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # ========== 动态多数据源配置（简化）==========
  datasource:
    dynamic:
      strict: false
      public-key: '438704315@qq.com'
      primary: hboot
      datasource:
        hboot:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/h_boot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: 123456
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1 FROM DUAL
            test-on-borrow: false
            test-on-return: false
            # 应用过滤器
            filters: stat,wall,slf4j
            connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000

        engine:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/turbo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: 123456
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1 FROM DUAL
            test-on-borrow: false
            test-on-return: false
            # 应用过滤器
            filters: stat,wall,slf4j
            connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000
  data:
    redis:
      # 基础配置
      host: localhost
      port: 6379
      password:  # 无密码则空，有密码填写你的redis密码
      database: 0
      # 超时配置
      timeout: 10000ms  # 连接超时时间，单位ms
      # lettuce客户端配置（SpringBoot3.x默认客户端，不用改）
      lettuce:
        pool:
          max-active: 8    # 连接池最大连接数
          max-idle: 8      # 连接池最大空闲连接数
          min-idle: 2      # 连接池最小空闲连接数
          max-wait: 5000ms # 连接池获取连接的最大等待时间，超时会报错
# 允许循环引用 turbo使用
  main:
    allow-circular-references: true

# MyBatis-Plus 配置保持不变...

# MyBatis-Plus 配置保持不变...

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.quinn.hboot.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# 其他配置保持不变...


# springdoc/swagger 配置 不变
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    default-model-expand-depth: 2
    default-model-rendering: example
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# 文件存储配置 不变
file:
  storage: local
  local:
    base-path: c:/upload
    public-url: http://localhost:8080/api/v1/file/preview

warm-flow:
  # 是否开启工作流，默认true
  enabled: true
  # 是否显示banner图，默认是
  banner: true
  # id生成器类型, 不填默认为orm扩展自带生成器或者warm-flow内置的19位雪花算法, SnowId14:14位，SnowId15:15位， SnowFlake19：19位
  key_type: SnowId19
  # 是否开启设计器ui，默认true
  ui: true
  # 如果需要工作流共享业务系统权限，默认Authorization，如果有多个token，用逗号分隔
  token-name: Authorization
  # 是否显示流程图顶部文字，默认为true：显示
  top-text-show: true
#  # 公共模型流程状态对应的三元色：如果只配置了这个，经典模式和仿钉钉模型的节点颜色共用这个
#  chart-status-color:
#    ## 未办理
#    - 166,178,189
#    ## 待办理
#    - 255,197,90
#    ## 已办理
#    - 135,206,250
#  # 经典模型流程状态对应的三元色：如果配置了，经典模型优先这个
#  chart-status-color-classics:
#    ## 未办理
#    - 166,178,189
#    ## 待办理
#    - 255,197,90
#    ## 已办理
#    - 135,206,250
#  # 仿钉钉模型流程状态对应的三元色：如果配置了，仿钉钉模型优先这个
#  chart-status-color-mimic:
#    ## 未办理
#    - 62,62,62
#    ## 待办理
#    - 255,205,23
#    ## 已办理
#    - 157,255,0

#  # 填充器，内部有默认实现，如果不满足实际业务，可通过此配置自定义实现
#  data-fill-handler-path: com.ruoyi.system.handle.CustomDataFillHandler
#  # 全局租户处理器，有多租户需要，可以配置自定义实现
#  tenant_handler_path: com.ruoyi.system.handle.CustomTenantHandler
#  # 是否开启逻辑删除（orm框架本身不支持逻辑删除，可通过这种方式开启，比如jpa）
#  logic_delete: true
#  # 逻辑删除字段值（开启后默认为2）
#  logic_delete_value: 2
#  # 逻辑未删除字段（开启后默认为0）
#  logic_not_delete_value: 0
#  # 当使用JPA时指定JpaPersistenceProvider
#  jpa_persistence_provider: org.springframework.orm.jpa.vendor.SpringHibernateJpaPersistenceProvider
