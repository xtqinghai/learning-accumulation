server:
  port: 8080
  multipart:
    enabled: true
    max-file-size: 100MB
    max-request-size: 100MB

logging:
  level:
    com.quinn.hboot.system.mapper: debug
    org.mybatis: debug
    com.quinn.hboot.system.controller: debug

spring:
  application:
    name: hboot-system
  config:
    import: classpath:codegen.yml
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL 8+ 驱动类
    url: jdbc:mysql://localhost:3306/h_boot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root # 你的数据库用户名
    password: AfgaqHawW1eQAEeXhS6FFvhNXOO2MQFXLrGPWxCSznfPd8MCa+Nzs3xQGwqRsWlJ/u+6ck4vxZNmqiYSV2CGJg== # 你的数据库密码
    type: com.alibaba.druid.pool.DruidDataSource
    druid: # Druid 连接池
      initial-size: 5 # 初始化连接池大小
      min-idle: 5 # 最小连接池数量
      max-active: 20 # 最大连接池数量
      max-wait: 60000 # 连接时最大等待时间（单位：毫秒）
      test-while-idle: true
      time-between-eviction-runs-millis: 60000 # 配置多久进行一次检测，检测需要关闭的连接（单位：毫秒）
      min-evictable-idle-time-millis: 300000 # 配置一个连接在连接池中最小生存的时间（单位：毫秒）
      max-evictable-idle-time-millis: 900000 # 配置一个连接在连接池中最大生存的时间（单位：毫秒）
      validation-query: SELECT 1 FROM DUAL # 配置测试连接是否可用的查询 sql
      connectionProperties: config.decrypt=true;config.decrypt.key=MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKehbEjfkeOqY0RnQNmcVS/FWEkZbDpiU72DJEw8fzFEDwjuF89OohyQshsN92ho5h/GQnIz6h8PHA35byFkxh8CAwEAAQ==
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/* # 配置监控后台访问路径
        login-username: admin # 配置监控后台登录的用户名、密码
        login-password: admin
      filter:
        config:
            enabled: true
        stat:
          enabled: true
          log-slow-sql: true # 开启慢 sql 记录
          slow-sql-millis: 2000 # 若执行耗时大于 2s，则视为慢 sql
          merge-sql: true
        wall: # 防火墙
          config:
            multi-statement-allow: true

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper.xml 文件位置（可选，若使用注解版可省略）
  mapper-locations: classpath:mapper/**/*.xml
  # 实体类别名包（可选）
  type-aliases-package: com.quinn.hboot.**.entity
  # 配置全局主键生成策略
  global-config:
    db-config:
      id-type: auto # 主键自增（可选值：AUTO/ASSIGN_ID/ASSIGN_UUID等）
      logic-delete-field: deleted # 全局逻辑删除字段名（可选）
      logic-delete-value: 1 # 逻辑删除值（默认1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认0）
  # 日志配置（开发环境开启，方便调试）
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 控制台打印SQL
    map-underscore-to-camel-case: true # 自动下划线转驼峰（默认开启）

# springdoc配置： https://springdoc.org/properties.html
# OpenAPI 配置（简化版）
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    default-model-expand-depth: 2
    default-model-rendering: example
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

#file storage
file:
  storage: local
  local:
    base-path: c:/upload
    public-url: http://localhost:8080/api/v1/file/preview
